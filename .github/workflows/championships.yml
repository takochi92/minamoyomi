name: update-official-title-records

on:
  schedule:
    - cron: '20 22 * * *' # Every morning 7:20 JST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-title-records
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 公式SG・PG1・G1記録集を保存
        run: python -m scraper.championships --budget-seconds 5400
      - name: 取得・表示のテスト
        run: |
          pip install pytest
          python -m pytest -q tests/test_championships.py
      - name: 原記録をコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper/database/championships
          if ! git diff --cached --quiet; then
            git commit -m "official championship records $(TZ=Asia/Tokyo date +%F)"
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              if [ "$i" = 4 ]; then exit 1; fi
              sleep 15
            done
          fi
      - name: 本番ページを再生成
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
