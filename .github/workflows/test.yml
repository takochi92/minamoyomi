name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: node worker/test.mjs
      - name: 本番保存データから全ページを生成できることを確認
        env:
          SITE_URL: https://teilog.pages.dev
        run: python -m scraper.sitegen
      - name: 表示確認用ページを保存
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          retention-days: 3
          path: |
            site/index.html
            site/style.css
            site/config.js
            site/clock.js
            site/note.js
            site/img/boat-v2.webp
            site/race/20261009/tokoname-4.html
