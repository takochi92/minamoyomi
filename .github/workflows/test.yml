name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: node worker/test.mjs
      - run: node update-watchdog/test.mjs
      - run: node update-watchdog/monitor.test.mjs
      - name: Cloudflare実行エンジンで監視と通知を検査（外部通信はテスト応答）
        run: |
          npm install --prefix .cache/watchdog-runtime --ignore-scripts --no-save --package-lock=false miniflare@4.20260405.0 esbuild@0.25.4
          MINIFLARE_MODULE="$GITHUB_WORKSPACE/.cache/watchdog-runtime/node_modules/miniflare" ESBUILD_MODULE="$GITHUB_WORKSPACE/.cache/watchdog-runtime/node_modules/esbuild" node update-watchdog/runtime.test.cjs
      - run: node tests/test_note_store.cjs
      - run: node tests/test_note_account.cjs
      - run: node tests/test_pwa.cjs
      - run: node tests/test_pwa_install.cjs
      - run: node tests/test_freshness.cjs
      - run: node tests/test_odds_grid.cjs
      - run: node tests/test_player_info.cjs
      - run: node tests/test_exhibition.cjs
      - run: node tests/test_exhibition_flow.cjs
      - run: node tests/test_stats_logic_flow.cjs
      - run: node tests/test_turn_review.cjs
      - run: node tests/test_turn_review_flow.cjs
      - run: node --test tests/test_season_conditions.cjs
      - run: node tests/test_push_worker.cjs
      - run: node tests/test_notification_account.cjs
      - run: node tests/test_edge_morning.cjs
      - name: 通知のDB権限と所有者分離を検査
        run: |
          npm install --prefix .cache/push-tests --ignore-scripts --no-save --package-lock=false @electric-sql/pglite@0.5.2
          PGLITE_MODULE="$GITHUB_WORKSPACE/.cache/push-tests/node_modules/@electric-sql/pglite" node tests/test_push_database.cjs
      - name: 通知配信コードと依存ロックを検査
        run: npx --yes deno@2.9.6 check --frozen --config supabase/functions/favorite-morning/deno.json --lock=supabase/functions/favorite-morning/deno.lock supabase/functions/favorite-morning/index.ts
      - name: 本番保存データから全ページを生成できることを確認
        env:
          SITE_URL: https://teilog.com
        run: python -m scraper.sitegen
      - name: 表示確認用ページを保存
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          retention-days: 3
          path: |
            site/index.html
            site/style.css
            site/config.js
            site/clock.js
            site/freshness.js
            site/freshness.json
            site/note.js
            site/note-store.js
            site/note-account.js
            site/vendor/
            site/mynote.html
            site/install.html
            site/exhibition.html
            site/exhibition.js
            site/exhibition.css
            site/pwa.js
            site/sw.js
            site/manifest.webmanifest
            site/offline.html
            site/img/pwa-180-v2.png
            site/img/pwa-192-v2.png
            site/img/pwa-512-v2.png
            site/img/pwa-512-maskable-v2.png
            site/img/boat-v2.webp
            site/race/20261009/tokoname-4.html
