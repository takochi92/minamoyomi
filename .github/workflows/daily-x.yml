# 毎朝・毎晩、その日の X 投稿文を site/data から作り、x-auto ブランチに保存する。
# AFE ポータルは x-auto/index.json を読み、本文コピーを提供する。
name: Daily X post

on:
  schedule:
    - cron: "13 23 * * *"
    - cron: "43 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning（朝）／evening（夜の結果）／feature（機能紹介）"
        default: "morning"
      date:
        description: "evening だけ：YYYYMMDD（空なら今日）"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-x
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make today's X post
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            if [ "${{ github.event.schedule }}" = "43 12 * * *" ]; then SLOT=evening; else SLOT=morning; fi
          fi
          python3 tools/make_daily_x.py --slot "$SLOT" --date "${{ github.event.inputs.date }}" --out out/x.json
      - name: Get draft history
        run: git clone --depth 1 -b x-auto "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" archive
      - name: Save drafts for AFE portal
        run: |
          node - <<'JS'
          const fs = require('fs');
          const history = JSON.parse(fs.readFileSync('archive/index.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync('out/x.json', 'utf8'));
          if (!Array.isArray(history.posts) || !Array.isArray(generated.posts)) throw Error('Invalid draft data');
          const now = new Date().toISOString();
          const additions = generated.posts.map(post => {
            if (post.project !== 'teirogu' || post.channel !== 'X' || !/^\d{4}-\d{2}-\d{2}$/.test(post.date) || !/^[a-z]+$/.test(post.slot) || typeof post.text !== 'string') throw Error('Invalid X draft');
            return { id: `${post.date}-teirogu-X-${post.slot}`, project: 'teirogu', channel: 'X', date: post.date, slot: post.slot, text: post.text, images: [], created_at: now };
          });
          const keys = new Set(additions.map(post => post.id));
          const posts = [...additions, ...history.posts.filter(post => !keys.has(post.id))]
            .sort((a,b) => String(b.created_at).localeCompare(String(a.created_at)))
            .slice(0, 60);
          fs.writeFileSync('archive/index.json', JSON.stringify({ updated: now, posts }, null, 2) + '\n');
          JS
          cd archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "Save X drafts $(date -u +%F)"
            git push origin HEAD:x-auto
          fi

