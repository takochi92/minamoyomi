name: update-course-stats

on:
  schedule:
    - cron: "15 21 * * *"   # 毎朝 6:15 JST（前日までの競走成績を取り込み）
  workflow_dispatch:
    inputs:
      days:
        description: "何日分さかのぼって取得するか（初回は 365）"
        default: "3"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 競走成績を取得してコース戦績を集計
        run: python -m scraper.history --days ${{ github.event.inputs.days || '3' }}
      - name: 実力補正のコース巧者スコア（狙い目レーサー用）
        run: python -m scraper.overperf
      - name: F持ち選手のF後スタート集計
        run: python -m scraper.fstart
      - name: 風向アイコンと方角の対応表（場ごと）
        run: python -m scraper.windmap
      - name: 選手のコース別・条件別成績（直近2年。出走表の「このコースの成績」）
        run: python -m scraper.coursest
      - name: 前日までの確定オッズと直前情報を保存
        run: python -m scraper.odds_backfill --days 3 --max 3000
      - name: 展示・機力の研究入力と結果を月別に保存
        run: python -m scraper.research_snapshot
      - name: 本人比・機力・重複条件と仮想購入の検証を更新
        run: python -m tools.research_review
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history research/improvements scraper/course_stats.json.gz scraper/exstats.json.gz scraper/overperf.json.gz scraper/fstart.json.gz scraper/motor.json.gz scraper/windmap.json scraper/coursest.json.gz
          git diff --cached --quiet || (git commit -q -m "course stats $(TZ=Asia/Tokyo date +%m/%d)" && (for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 15; done; exit 1))
