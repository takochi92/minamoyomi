name: exhibition-source-update
on:
  schedule:
    # JST 09:07–18:52 plus 20:17. Best effort, not a deadline guarantee.
    - cron: '7,22,37,52 0-9 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD（空欄は日本時間の当日）'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/exhibition.yml'
      - 'tools/update_exhibition.py'
permissions:
  contents: write
concurrency:
  # This job only writes source metadata. It cannot cancel pending race updates
  # or deploy an old snapshot of the whole site over newer predictions.
  group: exhibition-source-update
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REQUESTED_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/update_exhibition.py
            /scraper/__init__.py
            /scraper/exhibition_views.py
            /site/data/exhibition/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公開映像の登録を確認（未解析の数値は作らない）
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python -m tools.update_exhibition --date "$REQUESTED_DATE"
          else
            python -m tools.update_exhibition
          fi
      - name: 展示の登録情報だけ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/exhibition/research.json site/data/exhibition/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Heiwajima exhibition availability'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 反映経路を記録
        run: echo '登録情報を保存しました。サイトへの反映は次の通常更新で行います。無人タイム解析は未実装です。' >> "$GITHUB_STEP_SUMMARY"
