name: exhibition-source-update
on:
  schedule:
    # JST 09:07–18:52 plus 20:17. Best effort, not a deadline guarantee.
    - cron: '7,22,37,52 0-9 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD（空欄は日本時間の当日）'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/exhibition.yml'
      - 'tools/update_exhibition.py'
permissions:
  contents: write
concurrency:
  # Prevent an older full-site deployment racing the ordinary update job.
  group: update-races
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITEGEN_SPARSE: '1'
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      REQUESTED_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scraper/database/player_history/
            !/scraper/database/races/
            !/research/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 公開映像の登録を確認（未解析の数値は作らない）
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python -m tools.update_exhibition --date "$REQUESTED_DATE"
          else
            python -m tools.update_exhibition
          fi
      - name: 展示の登録情報だけ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/exhibition/research.json site/data/exhibition/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Heiwajima exhibition availability'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/cache/restore@v4
        with:
          path: .cache/sitegen
          key: public-site-v1-${{ github.run_id }}
          restore-keys: public-site-v1-
      - name: 既存の予想を変更せずページを生成
        run: python -m scraper.sitegen --cache-dir .cache/sitegen
      - name: サイトを公開
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
