name: update-next-meetings

on:
  schedule:
    - cron: '23 6,18 * * *' # JST 15:23 / 03:23
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/next_meetings.py'
      - '.github/workflows/next-meetings.yml'

permissions:
  contents: write

concurrency:
  group: next-meetings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 次回開催と出場予定を公式から取得
        run: python -m scraper.next_meetings
      - name: 保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/next_meetings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "next meetings $(TZ=Asia/Tokyo date +%F-%H:%M)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
