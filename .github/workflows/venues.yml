name: update-venues
on:
  schedule:
    - cron: "30 18 2 * *"   # 毎月3日 3:30 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  venues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.update_venues
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/venues.json
          git diff --cached --quiet || (git commit -m "venues $(date +%Y-%m)" && git push)
