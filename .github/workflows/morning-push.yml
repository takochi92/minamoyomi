name: favorite-morning-push
on:
  schedule:
    - cron: '13,33,53 23,0 * * *' # JST 8:13〜9:53; one digest per device/day
  workflow_dispatch:
concurrency:
  group: favorite-morning-push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    if: ${{ vars.PUSH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests 'pywebpush==2.0.3'
      - name: 朝の対象出走を通知（私的データはログに記録しない）
        env:
          PUSH_SUPABASE_URL: https://xkibgkdniwlfocwpmuzy.supabase.co
          PUSH_SUPABASE_SERVICE_KEY: ${{ secrets.PUSH_SUPABASE_SERVICE_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
        run: python -m tools.morning_push
