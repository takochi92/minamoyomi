name: update-races

on:
  push:
    branches: [main]
    paths:
      - 'scraper/model.json'
      - 'scraper/model.py'
      - 'scraper/predict.py'
      - 'scraper/prediction_context.py'
      - 'scraper/motoradj.py'
      - 'scraper/run.py'
      - 'scraper/sitegen.py'
      - 'scraper/ana_evaluation.py'
      - 'scraper/research_snapshot.py'
      - 'tools/forward_ana_review.py'
      - 'site/style.css'
      - 'site/img/**'
  schedule:
    # GitHub の cron は UTC。
    # JST 7:00〜22:55 は 5 分おき（レース中の直前情報・オッズ・結果）
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-13 * * *"
    # JST 0:00〜1:50 は 10 分おき：日付が変わったら翌日レースに一斉切替し、出走表と朝の予想をまとめて作成
    # （22時〜0時は当日の結果ページがそのまま見られる）
    - cron: "*/10 15-16 * * *"
  workflow_dispatch:

concurrency:
  group: update-races
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 公式サイトから取得して予想を更新
        run: python -m scraper.run
      - name: 締切前固定券の前向き仮想成績を集計
        run: python -m tools.forward_ana_review --output site/data/forward_ana.json
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -q -m "data $(TZ=Asia/Tokyo date +%m/%d-%H:%M)" && (for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 15; done; exit 1))
      - name: 検索エンジン向けの静的ページを生成（トップ・レース・場・選手・狙い目・サイトマップ）
        run: python -m scraper.sitegen
      - name: Cloudflare Pages へ公開
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
