name: update-races

on:
  push:
    branches: [main]
    paths:
      - 'scraper/model.json'
      - 'scraper/model.py'
      - 'scraper/predict.py'
      - 'scraper/prediction_context.py'
      - 'scraper/motoradj.py'
      - 'scraper/motor.py'
      - 'scraper/motor_renewals.json'
      - 'scraper/run.py'
      - 'scraper/sitegen.py'
      - 'scraper/exhibition_views.py'
      - 'site/exhibition.js'
      - 'site/exhibition.css'
      - 'site/data/exhibition/**'
      - 'scraper/build_cache.py'
      - '.github/workflows/update.yml'
      - 'scraper/target_methods.py'
      - 'scraper/overperf.py'
      - 'scraper/season_watch.py'
      - 'scraper/season_conditions.py'
      - 'scraper/season_views.py'
      - 'scraper/player_info.py'
      - 'scraper/prize_rankings.py'
      - 'site/player-info.js'
      - 'scraper/fl_leave.py'
      - 'scraper/parse.py'
      - 'site/season.js'
      - 'scraper/start_timing.py'
      - 'scraper/slit_model.py'
      - 'scraper/slit_model_constants.py'
      - 'site/slit.js'
      - 'scraper/racer_database.py'
      - 'scraper/racer_views.py'
      - 'scraper/database_build.py'
      - 'scraper/database_sources.py'
      - 'scraper/database_views.py'
      - 'scraper/championships.py'
      - 'scraper/race_archive.py'
      - 'site/database.js'
      - 'scraper/database/**'
      - 'site/search.js'
      - 'site/racer.js'
      - 'site/racer.css'
      - 'scraper/primary_slip.py'
      - 'scraper/probability_view.py'
      - 'scraper/ana_evaluation.py'
      - 'scraper/research_snapshot.py'
      - 'tools/forward_ana_review.py'
      - 'site/style.css'
      - 'site/pick.js'
      - 'site/live.js'
      - 'site/app.js'
      - 'site/config.js'
      - 'site/note.js'
      - 'site/note-store.js'
      - 'site/note-account.js'
      - 'site/race-notifications.js'
      - 'site/vendor/**'
      - 'site/about_body.html'
      - 'site/install_body.html'
      - 'site/pwa.js'
      - 'site/freshness.js'
      - 'site/sw.js'
      - 'site/manifest.webmanifest'
      - 'site/offline.html'
      - 'site/_headers'
      - 'site/img/**'
  schedule:
    # GitHub の cron は UTC。
    # JST 7:02〜22:57 は 5 分おき。毎時0分を避け、混雑による遅延を減らす。
    # schedule は実行時刻・起動を保証しない。停止時は workflow_dispatch で復旧する。
    - cron: "2-59/5 22-23 * * *"
    - cron: "2-59/5 0-13 * * *"
    # JST 0:03〜1:53 は 10 分おき：日付が変わったら翌日レースに一斉切替し、出走表と朝の予想をまとめて作成
    # （22時〜0時は当日の結果ページがそのまま見られる）
    - cron: "3-59/10 15-16 * * *"
  workflow_dispatch:

concurrency:
  group: update-races
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 日付切替の取得（約5分）と全再生成・公開が重なる場合も完了させる。
    timeout-minutes: 25
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      SITEGEN_SPARSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scraper/database/player_history/
            !/scraper/database/races/
            !/research/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 公式サイトから取得して予想を更新
        run: python -m scraper.run
      - name: 締切前固定券の前向き仮想成績を集計
        run: python -m tools.forward_ana_review --output site/data/forward_ana.json
      - name: イン残り高配当の研究券を集計
        run: python -m tools.in_survivor_forward --output site/data/in_survivor_forward.json
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -q -m "data $(TZ=Asia/Tokyo date +%m/%d-%H:%M)" && (for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 15; done; exit 1))
      - name: 変更のない公開ページの再利用データを取得
        uses: actions/cache/restore@v4
        with:
          path: .cache/sitegen
          key: public-site-v1-${{ github.run_id }}
          restore-keys: public-site-v1-
      - name: 最新レースを優先して全ページを生成（変更済みの入力は再生成）
        id: sitegen
        run: python -m scraper.sitegen --cache-dir .cache/sitegen
      - name: Cloudflare Pages へ公開
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
      - name: 次回の更新に使う公開ページを保存
        if: steps.sitegen.outputs.cache_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sitegen
          key: public-site-v1-${{ github.run_id }}
