name: update-races

on:
  schedule:
    # GitHub の cron は UTC。JST 7:00〜21:55 に 5 分おき（混雑時は数分遅れることがあります）
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-13 * * *"
    - cron: "*/10 15-16 * * *"
  workflow_dispatch:

concurrency:
  group: update-races
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 公式サイトから取得して予想を更新
        run: python -m scraper.run
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -q -m "data $(TZ=Asia/Tokyo date +%m/%d-%H:%M)" && git pull -q --rebase && git push -q)
      - name: 検索エンジン向けの静的ページを生成（トップ・レース・場・選手・狙い目・サイトマップ）
        run: python -m scraper.sitegen
      - name: Cloudflare Pages へ公開
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
