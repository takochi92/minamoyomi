name: update-meeting-data

on:
  schedule:
    - cron: '7,22,37,52 22-23,0-13 * * *' # JST 7–22時、15分おき
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/meeting.py'
      - 'scraper/meeting_update.py'
      - '.github/workflows/meetings.yml'

permissions:
  contents: write

concurrency:
  group: meeting-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 公開の節間データを取得（通常更新とは別処理）
        run: python -m scraper.meeting_update
      - name: 保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d site/data/meetings ]; then exit 0; fi
          git add site/data/meetings
          if ! git diff --cached --quiet; then
            git commit -m "meeting data $(TZ=Asia/Tokyo date +%F-%H:%M)"
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              if [ "$i" = 4 ]; then exit 1; fi
              sleep 15
            done
          fi
