name = "teilog-update-watchdog"
main = "src/index.mjs"
compatibility_date = "2026-10-27"

[triggers]
# One account trigger; the handler stops before HTTP requests outside JST hours.
crons = ["* * * * *"]

[vars]
DISPATCH_TOKEN_EXPIRES_ON = "2027-01-25"
ADMIN_ALERTS_ENABLED = "true"

[[durable_objects.bindings]]
name = "UPDATE_MONITOR"
class_name = "UpdateMonitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UpdateMonitor"]

# GitHub Actions write, restricted to takochi92/minamoyomi only.
# Supply UPDATE_DISPATCH_TOKEN as a Worker secret; never commit a token.
