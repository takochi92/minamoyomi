# 艇ログ ライブオッズ Worker
# 初回だけ：npx wrangler kv namespace create LIVE → 出てきた id を下の id に貼る
name = "teilog-live"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* 22-23 * * *", "* 0-12 * * *"]   # JST 7:00〜21:59 に毎分（UTC表記）

[vars]
SITE_URL = "https://example.com"         # 公開サイトのURL（index.json を読む）
ALLOW_ORIGIN = "*"                        # 公開後はサイトのURLにしぼる

[[kv_namespaces]]
binding = "LIVE"
id = "REPLACE_WITH_KV_ID"
